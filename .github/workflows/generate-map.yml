name: Generate municipality map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-map:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

        - name: Install map dependencies
        run: |
          pip install 'swemaps==0.2.2'
          pip install pyarrow
          pip install geoarrow-rust-io

      - name: Generate GeoJSON
        run: python generate_vg_geojson.py

      - name: Verify GeoJSON
        run: |
          test -s vg_municipalities.geojson
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("vg_municipalities.geojson")
          data = json.loads(path.read_text(encoding="utf-8"))
          features = data.get("features", [])

          if data.get("type") != "FeatureCollection":
              raise SystemExit("GeoJSON är inte en FeatureCollection")

          if len(features) != 49:
              raise SystemExit(
                  f"Förväntade 49 kommuner men fick {len(features)}"
              )

          print(f"Verifierade {len(features)} kommuner")
          PY

      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vg_municipalities.geojson

          if git diff --cached --quiet; then
            echo "Kartfilen är redan uppdaterad."
          else
            git commit -m "Generate municipality GeoJSON"
            git push
          fi
